<p-card>
  <ng-template #title>
    <div class="branding-preview__header">
      <span class="card-title">Preview</span>
      @if (usesUploadedImage()) {
        <span class="branding-preview__note">
          <i class="pi pi-info-circle"></i>
          Uploaded images appear in the preview only after saving.
        </span>
      }
      <div class="branding-preview__selects">
        <p-select
            [options]="categories"
            optionLabel="label"
            [ngModel]="category()"
            (ngModelChange)="selectCategory($event)"
            ariaLabel="Preview category"
        />
        <p-select
            [options]="category().pages"
            optionLabel="label"
            optionValue="value"
            [ngModel]="page()"
            (ngModelChange)="page.set($event)"
            ariaLabel="Preview page"
        />
        <p-select
            [options]="langs"
            optionLabel="label"
            optionValue="value"
            [ngModel]="lang()"
            (ngModelChange)="lang.set($event)"
            ariaLabel="Preview language"
        />
      </div>
    </div>
  </ng-template>
  @if (html(); as doc) {
    <iframe
        class="branding-preview__frame"
        title="Workflow page preview"
        sandbox="allow-same-origin"
        [srcdoc]="doc"
        (load)="lockLinks(frame)"
        #frame
    ></iframe>
  }
</p-card>
