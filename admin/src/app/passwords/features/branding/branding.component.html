<div class="page-container">

  <h2>{{ tableInformation.title }}</h2>

  @if (isLoaded()) {
    <frm-form
        [config]="config()"
        [columnsCount]="2"
        [(model)]="model"
        [showReset]="true"
        [showSubmit]="true"
        [submitButtonLabel]="'Save'"
        (submitted)="onSubmitted($event)"
    />
  }

</div>
