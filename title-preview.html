<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoxNox – Brand Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    :root {
      --c1: #FFB347;
      --c2: #FF5500;
      --bg: #111;
      --card: #1a1a1a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: sans-serif;
      padding: 48px 32px;
    }

    /* ── wordmark ── */
    .wordmark {
      display: inline-flex;
      align-items: flex-end;
      gap: 0;
      line-height: 1;
      /* font-size set inline per instance; everything scales from it */
    }
    .wordmark svg {
      display: block;
      height: 1cap;     /* 1cap = exact cap-height of the current font */
      width: auto;
      flex-shrink: 0;
    }
    .wm-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.78em;  /* scaled so text cap-top aligns with F top when bottom-aligned */
      background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      letter-spacing: 0.04em;
    }

    /* ── section layout ── */
    .section-label {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 20px;
    }
    .panel {
      background: var(--card);
      border: 1px solid #222;
      border-radius: 14px;
      padding: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .panel-light {
      background: #f0f0f0;
      border-color: #ddd;
    }
    .sizes {
      display: flex;
      align-items: flex-end;
      gap: 48px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <!-- ── Stylised F: diagonal bar terminals, unified slope ── -->

  <!-- HERO –– large -->
  <p class="section-label">Wordmark — dark background</p>
  <div class="panel">
    <div class="wordmark" style="font-size: 120px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 73 100" aria-hidden="true">
        <defs><linearGradient id="fg1" x1="0" y1="0" x2="73" y2="100" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FFB347"/><stop offset="100%" stop-color="#FF5500"/>
        </linearGradient></defs>
        <path d="M 0 100 L 20 100 L 20 64 L 46 64 L 60 44 L 20 44 L 20 20 L 58 20 L 72 0 L 0 0 Z"
              fill="url(#fg1)"/>
      </svg>
      <span class="wm-text">oxnox</span>
    </div>
  </div>

  <!-- HERO –– light background -->
  <p class="section-label">Wordmark — light background</p>
  <div class="panel panel-light">
    <div class="wordmark" style="font-size: 120px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 73 100" aria-hidden="true">
        <defs><linearGradient id="fg2" x1="0" y1="0" x2="73" y2="100" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FFB347"/><stop offset="100%" stop-color="#FF5500"/>
        </linearGradient></defs>
        <path d="M 0 100 L 20 100 L 20 64 L 46 64 L 60 44 L 20 44 L 20 20 L 58 20 L 72 0 L 0 0 Z"
              fill="url(#fg2)"/>
      </svg>
      <span class="wm-text">oxnox</span>
    </div>
  </div>

  <!-- SIZE SCALE -->
  <p class="section-label">Size scale</p>
  <div class="panel">
    <div class="sizes">

      <!-- large -->
      <div class="wordmark" style="font-size: 80px">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 73 100" aria-hidden="true">
          <defs><linearGradient id="fg3" x1="0" y1="0" x2="73" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFB347"/><stop offset="100%" stop-color="#FF5500"/>
          </linearGradient></defs>
          <path d="M 0 100 L 20 100 L 20 64 L 46 64 L 60 44 L 20 44 L 20 20 L 58 20 L 72 0 L 0 0 Z"
                fill="url(#fg3)"/>
        </svg>
        <span class="wm-text">oxnox</span>
      </div>

      <!-- medium -->
      <div class="wordmark" style="font-size: 48px">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 73 100" aria-hidden="true">
          <defs><linearGradient id="fg4" x1="0" y1="0" x2="73" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFB347"/><stop offset="100%" stop-color="#FF5500"/>
          </linearGradient></defs>
          <path d="M 0 100 L 20 100 L 20 64 L 46 64 L 60 44 L 20 44 L 20 20 L 58 20 L 72 0 L 0 0 Z"
                fill="url(#fg4)"/>
        </svg>
        <span class="wm-text">oxnox</span>
      </div>

      <!-- small -->
      <div class="wordmark" style="font-size: 28px">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 73 100" aria-hidden="true">
          <defs><linearGradient id="fg5" x1="0" y1="0" x2="73" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFB347"/><stop offset="100%" stop-color="#FF5500"/>
          </linearGradient></defs>
          <path d="M 0 100 L 20 100 L 20 64 L 46 64 L 60 44 L 20 44 L 20 20 L 58 20 L 72 0 L 0 0 Z"
                fill="url(#fg5)"/>
        </svg>
        <span class="wm-text">oxnox</span>
      </div>

      <!-- xsmall -->
      <div class="wordmark" style="font-size: 16px">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 73 100" aria-hidden="true">
          <defs><linearGradient id="fg6" x1="0" y1="0" x2="73" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFB347"/><stop offset="100%" stop-color="#FF5500"/>
          </linearGradient></defs>
          <path d="M 0 100 L 20 100 L 20 64 L 46 64 L 60 44 L 20 44 L 20 20 L 58 20 L 72 0 L 0 0 Z"
                fill="url(#fg6)"/>
        </svg>
        <span class="wm-text">oxnox</span>
      </div>

    </div>
  </div>

</body>
</html>
