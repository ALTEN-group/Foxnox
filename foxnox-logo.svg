<!-- FoxNox SVG Logo — stylised F (diagonal bar terminals) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 73 100" width="73" height="100">
  <defs>
    <linearGradient id="fGrad" x1="0" y1="0" x2="73" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
  </defs>
  <!--
    Stem: x 0–20, full height.
    Top bar: flat bottom to x=58, diagonal cut ↗ to tip at (72, 0).
    Mid bar:  flat bottom to x=46, same angle diagonal to tip at (60, 52).
    Both diagonals share the same 14px×20px slope — one unified rhythm.
  -->
  <path d="M 0 100 L 20 100 L 20 64 L 46 64 L 60 44 L 20 44
           L 20 20 L 58 20 L 72 0 L 0 0 Z"
        fill="url(#fGrad)" />
</svg>
